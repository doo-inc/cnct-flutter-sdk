include: package:lints/recommended.yaml

analyzer:
  language:
    strict-casts: true
    strict-raw-types: true
  errors:
    # This package runs inside other people's applications. A missing return type or an implicit
    # dynamic there is not a style preference — it is an API somebody has to guess at.
    always_declare_return_types: error
    public_member_api_docs: ignore
  exclude:
    - example/flutter_app/**

linter:
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - avoid_slow_async_io
    - cancel_subscriptions
    - close_sinks
    - directives_ordering
    - only_throw_errors
    - prefer_final_locals
    - prefer_single_quotes
    - sort_pub_dependencies
    - unawaited_futures
    - unnecessary_lambdas
    - use_super_parameters
