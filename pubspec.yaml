name: cnct_flutter_sdk
description: The official CNCT SDK for Flutter and Dart — live chat, contacts, bookings and tickets against a CNCT workspace, using the credentials CNCT issues you.
version: 0.1.0
repository: https://github.com/doo-inc/cnct-flutter-sdk
issue_tracker: https://github.com/doo-inc/cnct-flutter-sdk/issues

environment:
  sdk: ^3.0.0

dependencies:
  http: ^1.2.0
  web_socket_channel: ^3.0.0

dev_dependencies:
  lints: ^5.0.0
  stream_channel: ^2.1.2
  test: ^1.25.0
